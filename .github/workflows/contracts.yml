name: Contract validation

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Install locked devenv
        run: nix profile install github:NixOS/nixpkgs/56c02bc00adcf003215cc4bd996d6efaf4cff188#devenv
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned commit
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - name: Validate contracts
        run: devenv shell -- contracts-validate
      - name: Check Rust formatting
        run: devenv shell -- fmt-check
      - name: Lint
        run: devenv shell -- clippy-check
      - name: Test
        run: devenv shell -- test-all
      - name: Check documentation formatting
        run: devenv shell -- docs-check
      - name: Check dependency policy
        run: devenv shell -- deny-check
