[workspace]
members = [
  "crates/oxyflut",
  "crates/oxyflut-runtime",
  "crates/oxyflut-layout",
  "crates/oxyflut-scene",
  "crates/oxyflut-assets",
  "crates/oxyflut-view",
  "crates/oxyflut-input",
  "crates/oxyflut-text",
  "crates/oxyflut-semantics",
  "crates/oxyflut-platform",
  "crates/oxyflut-diagnostics",
  "crates/oxyflut-qualification",
  "crates/oxyflut-substrate",
  "crates/oxyflut-substrate-impeller",
  "crates/oxyflut-substrate-engine",
  "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[workspace.dependencies]
thiserror = { version = "=2.0.20", default-features = false }
slotmap = { version = "=1.1.1", default-features = false }
smallvec = { version = "=1.15.1", default-features = false }
crossbeam-channel = { version = "=0.5.16", default-features = false }
bitflags = { version = "=2.13.1", default-features = false }
unicode-segmentation = { version = "=1.13.3", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
serde = { version = "=1.0.229", default-features = false }
serde_json = { version = "=1.0.151", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
jsonschema = { version = "=0.51.0", default-features = false }
proptest = { version = "=1.11.0", default-features = false }
criterion = { version = "=0.8.2", default-features = false }
bindgen = { version = "=0.72.1", default-features = false }
cbindgen = { version = "=0.29.4", default-features = false }
objc2 = { version = "=0.6.4", default-features = false }
objc2-app-kit = { version = "=0.3.2", default-features = false }
windows = { version = "=0.62.2", default-features = false }
gtk4 = { version = "=0.11.4", default-features = false, features = ["v4_20"] }
glib = { version = "=0.22.8", default-features = false }
wayland-client = { version = "=0.31.15", default-features = false }
wayland-protocols = { version = "=0.32.13", default-features = false }
x11rb = { version = "=0.14.0", default-features = false }
